<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3a6">
<title>Para Sahedit 💛</title>

<style>
  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }

  body{
    background:
      radial-gradient(circle at 50% 5%,rgba(255,255,255,.98),transparent 26%),
      linear-gradient(180deg,#fffbe7 0%,#fff0a4 58%,#d9edab 100%);
    color:#5f4900;
  }

  .screen{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    transition:opacity .75s ease, transform .75s ease, visibility .75s;
  }

  /* =========================
     PORTADA
     ========================= */
  #cover{
    z-index:20;
    padding:22px;
  }

  .card{
    width:min(430px,92vw);
    border:0;
    border-radius:30px;
    padding:0;
    background:rgba(255,255,255,.82);
    box-shadow:0 22px 70px rgba(87,65,0,.22);
    overflow:hidden;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:transform .25s ease, box-shadow .25s ease;
  }

  .card:hover{
    transform:translateY(-5px);
    box-shadow:0 30px 80px rgba(87,65,0,.30);
  }

  .cover-art{
    display:block;
    width:100%;
    height:auto;
  }

  .card-text{
    padding:22px 22px 25px;
    text-align:center;
  }

  .card-text h1{
    margin:0 0 8px;
    font-size:clamp(1.9rem,7vw,2.8rem);
    font-weight:800;
  }

  .card-text p{
    margin:0;
    font-size:1rem;
  }

  .tap{
    margin-top:14px!important;
    font-weight:750;
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    50%{transform:scale(1.05)}
  }

  /* =========================
     ESCENA FINAL
     ========================= */
  #scene{
    z-index:10;
    opacity:0;
    visibility:hidden;
    transform:scale(1.03);
  }

  body.open #cover{
    opacity:0;
    visibility:hidden;
    transform:scale(.96);
  }

  body.open #scene{
    opacity:1;
    visibility:visible;
    transform:scale(1);
  }

  .message{
    position:absolute;
    top:max(34px,env(safe-area-inset-top));
    left:50%;
    width:min(92vw,730px);
    transform:translateX(-50%);
    text-align:center;
    z-index:8;
    text-shadow:0 2px 0 rgba(255,255,255,.75);
    opacity:0;
  }

  body.open .message{
    animation:messageIn 1s ease .35s forwards;
  }

  .message h2{
    margin:0 0 8px;
    font-size:clamp(2.2rem,8vw,4.8rem);
    line-height:1;
  }

  .message p{
    margin:0;
    font-size:clamp(1rem,3.4vw,1.35rem);
    line-height:1.45;
  }

  @keyframes messageIn{
    from{opacity:0;transform:translateX(-50%) translateY(-12px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}
  }

  .sun{
    position:absolute;
    right:7vw;
    top:13vh;
    width:min(90px,18vw);
    aspect-ratio:1;
    border-radius:50%;
    background:#ffd84d;
    box-shadow:0 0 70px #ffdf68;
    opacity:.48;
  }

  .ground{
    position:absolute;
    left:50%;
    bottom:-28px;
    transform:translateX(-50%);
    width:120vw;
    height:95px;
    border-radius:50%;
    background:rgba(103,145,54,.16);
  }

  .flower-wrap{
    position:absolute;
    left:50%;
    bottom:-2vh;
    width:min(620px,96vw);
    transform:translateX(-50%);
    transform-origin:50% 100%;
    filter:drop-shadow(0 14px 12px rgba(84,68,0,.18));
  }

  body.open .flower-wrap{
    animation:sway 5s ease-in-out 3.3s infinite;
  }

  @keyframes sway{
    0%,100%{transform:translateX(-50%) rotate(-1.3deg)}
    50%{transform:translateX(-50%) rotate(1.3deg)}
  }

  /* TALLO */
  .stem{
    stroke-dasharray:530;
    stroke-dashoffset:530;
  }

  body.open .stem{
    animation:drawStem 1.1s ease .15s forwards;
  }

  @keyframes drawStem{
    to{stroke-dashoffset:0}
  }

  /* HOJAS */
  .leaf{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }

  body.open .leaf.l1{
    animation:leafIn .65s ease .80s forwards;
  }

  body.open .leaf.l2{
    animation:leafIn .65s ease .95s forwards;
  }

  @keyframes leafIn{
    from{opacity:0;transform:scale(.2)}
    to{opacity:1;transform:scale(1)}
  }

  /* PÉTALOS:
     La rotación está en <g> y el crecimiento en <ellipse>,
     por eso ya no se pisan los transforms. */
  .petal{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }

  body.open .p1 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.00s forwards}
  body.open .p2 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.08s forwards}
  body.open .p3 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.16s forwards}
  body.open .p4 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.24s forwards}
  body.open .p5 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.32s forwards}
  body.open .p6 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.40s forwards}
  body.open .p7 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.48s forwards}
  body.open .p8 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.56s forwards}
  body.open .p9 {animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.64s forwards}
  body.open .p10{animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.72s forwards}
  body.open .p11{animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.80s forwards}
  body.open .p12{animation:bloom .62s cubic-bezier(.18,.85,.25,1.2) 1.88s forwards}

  @keyframes bloom{
    0%{opacity:0;transform:scale(.05)}
    75%{opacity:1;transform:scale(1.08)}
    100%{opacity:1;transform:scale(1)}
  }

  /* CENTRO */
  .center{
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
  }

  body.open .center{
    animation:centerIn .65s ease 2.10s forwards;
  }

  @keyframes centerIn{
    from{opacity:0;transform:scale(.25)}
    to{opacity:1;transform:scale(1)}
  }

  /* BRILLOS */
  .spark{
    position:absolute;
    bottom:7vh;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff5a4;
    box-shadow:0 0 10px #ffe45a;
    opacity:0;
  }

  body.open .spark{
    animation:floatUp linear infinite;
  }

  body.open .s1{left:10%;animation-duration:7s;animation-delay:2.2s}
  body.open .s2{left:25%;animation-duration:9s;animation-delay:2.8s}
  body.open .s3{left:42%;animation-duration:8s;animation-delay:3.4s}
  body.open .s4{left:58%;animation-duration:10s;animation-delay:2.5s}
  body.open .s5{left:74%;animation-duration:7.5s;animation-delay:3s}
  body.open .s6{left:89%;animation-duration:8.7s;animation-delay:3.8s}

  @keyframes floatUp{
    0%{transform:translateY(0) scale(.4);opacity:0}
    14%{opacity:.9}
    100%{transform:translateY(-82vh) translateX(25px) scale(1.2);opacity:0}
  }

  .again{
    position:absolute;
    right:16px;
    bottom:max(16px,env(safe-area-inset-bottom));
    border:1px solid rgba(86,67,0,.15);
    background:rgba(255,255,255,.68);
    color:#5f4900;
    padding:10px 15px;
    border-radius:999px;
    font:inherit;
    font-weight:650;
    cursor:pointer;
    backdrop-filter:blur(8px);
    z-index:9;
    opacity:0;
  }

  body.open .again{
    animation:buttonIn .7s ease 3.1s forwards;
  }

  @keyframes buttonIn{
    to{opacity:1}
  }
</style>
</head>

<body>

<!-- PORTADA CLICABLE -->
<section id="cover" class="screen">
  <button class="card" id="openBtn" aria-label="Abrir flores para Sahedit">

    <svg class="cover-art" viewBox="0 0 520 360"
         xmlns="http://www.w3.org/2000/svg"
         role="img"
         aria-label="Flor amarilla">

      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffbe7"/>
          <stop offset="1" stop-color="#ffe796"/>
        </linearGradient>

        <radialGradient id="py" cx="45%" cy="30%" r="78%">
          <stop offset="0" stop-color="#fff57a"/>
          <stop offset=".65" stop-color="#ffd32b"/>
          <stop offset="1" stop-color="#eea900"/>
        </radialGradient>
      </defs>

      <rect width="520" height="360" fill="url(#bg)"/>

      <path d="M260 200 C255 245 255 295 260 360"
            fill="none" stroke="#438d45"
            stroke-width="12" stroke-linecap="round"/>

      <ellipse cx="225" cy="287" rx="47" ry="20"
               fill="#52a74d"
               transform="rotate(-25 225 287)"/>

      <ellipse cx="294" cy="309" rx="48" ry="20"
               fill="#4b9f47"
               transform="rotate(24 294 309)"/>

      <g transform="translate(260 155)">
        <g transform="rotate(0)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(45)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(90)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(135)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(180)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(225)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(270)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <g transform="rotate(315)"><ellipse rx="42" ry="87" cy="-68" fill="url(#py)"/></g>
        <circle r="53" fill="#754400"/>
        <circle r="34" fill="#9d6507"/>
      </g>
    </svg>

    <div class="card-text">
      <h1>Para Sahedit 💛</h1>
      <p>Hay un pequeño detalle detrás de esta imagen.</p>
      <p class="tap">Toca una sola vez para abrir 🌻</p>
    </div>

  </button>
</section>


<!-- FLOR FINAL -->
<section id="scene" class="screen">

  <div class="sun"></div>
  <div class="ground"></div>

  <div class="message">
    <h2>Para Sahedit 🌻</h2>
    <p>
      Un pequeño detalle amarillo para alegrarte el día.<br>
      Recuerda lo fuerte que eres y todo lo que aún puedes lograr. 💛
    </p>
  </div>

  <span class="spark s1"></span>
  <span class="spark s2"></span>
  <span class="spark s3"></span>
  <span class="spark s4"></span>
  <span class="spark s5"></span>
  <span class="spark s6"></span>

  <svg class="flower-wrap"
       viewBox="0 0 650 780"
       xmlns="http://www.w3.org/2000/svg">

    <defs>
      <radialGradient id="pet" cx="50%" cy="28%" r="78%">
        <stop offset="0" stop-color="#fff981"/>
        <stop offset=".57" stop-color="#ffd82f"/>
        <stop offset="1" stop-color="#f0ab00"/>
      </radialGradient>

      <radialGradient id="cen" cx="42%" cy="35%" r="72%">
        <stop offset="0" stop-color="#bd7c17"/>
        <stop offset=".65" stop-color="#754500"/>
        <stop offset="1" stop-color="#482700"/>
      </radialGradient>

      <linearGradient id="stemG" x1="0" x2="1">
        <stop offset="0" stop-color="#2f7439"/>
        <stop offset=".55" stop-color="#51a34e"/>
        <stop offset="1" stop-color="#276734"/>
      </linearGradient>
    </defs>

    <!-- TALLO -->
    <path class="stem"
          d="M325 360 C318 470 318 600 327 770"
          fill="none"
          stroke="url(#stemG)"
          stroke-width="24"
          stroke-linecap="round"/>

    <!-- HOJAS -->
    <path class="leaf l1"
          d="M316 545 C244 479 174 505 137 577 C214 589 275 566 321 535 Z"
          fill="#4d9f47"/>

    <path class="leaf l2"
          d="M331 625 C401 559 473 584 511 655 C437 669 377 645 326 615 Z"
          fill="#55a94e"/>

    <path class="leaf l1"
          d="M312 548 C252 534 203 546 151 574"
          fill="none"
          stroke="#317332"
          stroke-width="6"
          opacity=".62"/>

    <path class="leaf l2"
          d="M337 626 C399 613 447 624 496 651"
          fill="none"
          stroke="#337633"
          stroke-width="6"
          opacity=".62"/>

    <!-- FLOR -->
    <g transform="translate(325 300)">

      <!-- La rotación está en el grupo.
           El ellipse solo hace scale durante la animación. -->
      <g transform="rotate(0)">
        <ellipse class="petal p1" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(30)">
        <ellipse class="petal p2" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(60)">
        <ellipse class="petal p3" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(90)">
        <ellipse class="petal p4" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(120)">
        <ellipse class="petal p5" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(150)">
        <ellipse class="petal p6" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(180)">
        <ellipse class="petal p7" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(210)">
        <ellipse class="petal p8" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(240)">
        <ellipse class="petal p9" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(270)">
        <ellipse class="petal p10" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(300)">
        <ellipse class="petal p11" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <g transform="rotate(330)">
        <ellipse class="petal p12" rx="60" ry="137" cy="-145" fill="url(#pet)"/>
      </g>

      <!-- CENTRO -->
      <g class="center">
        <circle r="104" fill="url(#cen)"/>

        <g fill="#d59a26" opacity=".78">
          <circle cx="-45" cy="-38" r="8"/>
          <circle cx="-14" cy="-57" r="7"/>
          <circle cx="22" cy="-51" r="8"/>
          <circle cx="50" cy="-23" r="7"/>
          <circle cx="48" cy="17" r="8"/>
          <circle cx="17" cy="48" r="7"/>
          <circle cx="-23" cy="49" r="8"/>
          <circle cx="-52" cy="19" r="7"/>
          <circle cx="-19" cy="-12" r="8"/>
          <circle cx="20" cy="-12" r="7"/>
          <circle cx="2" cy="18" r="7"/>
        </g>
      </g>

    </g>
  </svg>

  <button class="again" id="againBtn">↻ Ver otra vez</button>

</section>

<script>
  const openBtn = document.getElementById("openBtn");
  const againBtn = document.getElementById("againBtn");

  // UN SOLO CLIC activa todas las animaciones
  openBtn.addEventListener("click", () => {
    document.body.classList.add("open");
  }, { once:true });

  // Recarga para repetir la animación desde cero
  againBtn.addEventListener("click", () => {
    location.reload();
  });
</script>

</body>
</html>
